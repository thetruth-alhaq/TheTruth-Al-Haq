name: Store Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to submit (android, ios, both)'
        required: true
        default: 'both'
        type: choice
        options:
          - android
          - ios
          - both
      track:
        description: 'Google Play track (internal, alpha, beta, production)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  submit-android:
    name: Submit to Google Play Store
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Write Google Service Account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > google-service-account.json

      - name: Build AAB for store
        run: eas build --platform android --profile store --local --output ./app-release.aab --non-interactive

      - name: Submit to Google Play
        run: eas submit --platform android --profile production --path ./app-release.aab --non-interactive

      - name: Summary
        run: |
          echo "### Android Submitted to Google Play" >> $GITHUB_STEP_SUMMARY
          echo "- **Track:** ${{ github.event.inputs.track }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** store (AAB)" >> $GITHUB_STEP_SUMMARY

  submit-ios:
    name: Submit to Apple App Store
    runs-on: macos-latest
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Ruby (for CocoaPods + Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Fastlane
        run: gem install fastlane

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build IPA for store
        run: eas build --platform ios --profile production --local --output ./TheTruthAlHaq.ipa --non-interactive

      - name: Submit to Apple App Store
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: eas submit --platform ios --profile production --path ./TheTruthAlHaq.ipa --non-interactive

      - name: Summary
        run: |
          echo "### iOS Submitted to App Store Connect" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** production (IPA)" >> $GITHUB_STEP_SUMMARY
          echo "- The build will appear in TestFlight after processing (10-15 min)" >> $GITHUB_STEP_SUMMARY
