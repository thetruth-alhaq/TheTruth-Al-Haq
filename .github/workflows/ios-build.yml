name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    name: Build iOS IPA (Local)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Fastlane
        run: gem install fastlane

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build IPA locally (uses EAS credentials, no cloud credits)
        run: |
          mkdir -p build-output
          eas build --platform ios --profile preview --local --non-interactive --output=build-output/TheTruthAlHaq.ipa 2>&1 | tee build-output/eas-build-log.txt
          if [ -f build-output/TheTruthAlHaq.ipa ]; then
            echo "=== IPA BUILD SUCCEEDED ==="
            ls -la build-output/TheTruthAlHaq.ipa
          else
            echo "=== IPA BUILD FAILED ==="
            tail -100 build-output/eas-build-log.txt
            exit 1
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build-output/eas-build-log.txt

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-ipa
          path: build-output/*.ipa
          retention-days: 30
