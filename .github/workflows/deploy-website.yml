name: Deploy Website to Public Repo

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy-policy.html'
      - 'support.html'
      - 'app-icon.png'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Push to public Pages repo
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          cd $RUNNER_TEMP
          git clone https://x-access-token:${PAGES_TOKEN}@github.com/thetruth-alhaq/TheTruth-Al-Haq.git pages-repo
          cd pages-repo
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # Copy website files from source repo
          cp $GITHUB_WORKSPACE/index.html .
          cp $GITHUB_WORKSPACE/privacy-policy.html .
          cp $GITHUB_WORKSPACE/support.html .
          cp $GITHUB_WORKSPACE/app-icon.png .
          
          git add -A
          git diff --quiet && git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-deploy website from private source repo"
          git push origin main
